<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACE 营销工作台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: product shell — a slim side nav with three tools; each tool is an input card beside a results column. One accent (blue), ink-black primary actions, hairline borders, no heavy cards. */
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --surface-2: #F1F3F8; --surface-3: #E8EBF2;
  --fg: #121622; --fg-2: #3D4357; --muted: #7B8296;
  --line: rgba(18,22,34,.08); --line-2: rgba(18,22,34,.16);
  --accent: #2E62FF; --accent-soft: #EAF0FF; --accent-ink: #FFFFFF;
  --ink: #121622; --ink-fg: #FFFFFF;
  --ok: #1B9A67; --ok-soft: #E2F6EC; --warn: #C07A10; --warn-soft: #FFF2DB; --bad: #D64A4A; --bad-soft: #FDE9E9;
  --shadow-sm: 0 1px 2px rgba(18,22,34,.05); --shadow: 0 12px 32px -16px rgba(18,22,34,.22);
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1016; --surface: #161922; --surface-2: #1E222D; --surface-3: #272C39;
    --fg: #EEF0F6; --fg-2: #C5CAD8; --muted: #8C93A7;
    --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16);
    --accent: #6C8CFF; --accent-soft: #1D2746; --accent-ink: #0E1016;
    --ink: #EEF0F6; --ink-fg: #0E1016;
    --ok: #3FC48C; --ok-soft: #133125; --warn: #E3A43B; --warn-soft: #3A2C12; --bad: #F06A6A; --bad-soft: #3B1A1A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 12px 32px -16px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1016; --surface: #161922; --surface-2: #1E222D; --surface-3: #272C39;
  --fg: #EEF0F6; --fg-2: #C5CAD8; --muted: #8C93A7;
  --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.16);
  --accent: #6C8CFF; --accent-soft: #1D2746; --accent-ink: #0E1016;
  --ink: #EEF0F6; --ink-fg: #0E1016;
  --ok: #3FC48C; --ok-soft: #133125; --warn: #E3A43B; --warn-soft: #3A2C12; --bad: #F06A6A; --bad-soft: #3B1A1A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 12px 32px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; z-index: 30;
  display: flex; flex-direction: column; gap: 6px; padding: 18px 14px;
  background: var(--surface); border-right: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: var(--ink-fg); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 12px; letter-spacing: .04em; flex: none; }
.brand b { font-size: 15px; font-weight: 700; display: block; line-height: 1.2; }
.brand small { font-size: 11.5px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; width: 100%; text-align: left;
  font-size: 14px; font-weight: 500; color: var(--fg-2); transition: background .12s ease;
}
.nav button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.nav button:hover { background: var(--surface-2); color: var(--fg); }
.nav button.on { background: var(--surface-2); color: var(--fg); font-weight: 600; }
.nav button .d { font-size: 11.5px; color: var(--muted); font-weight: 400; display: block; line-height: 1.3; }
.side .spacer { flex: 1; }
.side-foot { display: grid; gap: 8px; padding: 8px; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 500; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.status.ok i { background: var(--ok); } .status.ok { color: var(--ok); }
.status.warn i { background: var(--warn); } .status.warn { color: var(--warn); }
.status.live i { background: var(--accent); animation: blink 1s infinite; } .status.live { color: var(--accent); }
@keyframes blink { 50% { opacity: .25; } }
.linkbtn { font-size: 12.5px; color: var(--muted); text-align: left; padding: 2px 0; }
.linkbtn:hover { color: var(--fg); text-decoration: underline; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { height: auto; flex-direction: row; align-items: center; gap: 10px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .brand { padding: 0; flex: none; }
  .brand small { display: none; }
  .nav { flex-direction: row; gap: 4px; flex: none; }
  .nav button { padding: 7px 10px; white-space: nowrap; }
  .nav button .d { display: none; }
  .side .spacer { display: none; }
  .side-foot { flex: none; margin-left: auto; padding: 0; grid-auto-flow: column; align-items: center; }
  .linkbtn { white-space: nowrap; }
}

.main { padding: 28px clamp(16px, 4vw, 40px) 64px; min-width: 0; }
.tool { display: grid; gap: 22px; min-width: 0; }
.tool-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.tool-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.tool-head p { color: var(--muted); font-size: 13.5px; margin-top: 4px; max-width: 70ch; }
.tool-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.work { display: grid; grid-template-columns: 344px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1140px) { .work { grid-template-columns: minmax(0, 1fr); } }
.in {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; min-width: 0;
  max-height: calc(100vh - 40px); overflow: auto;
}
@media (max-width: 1140px) { .in { position: static; max-height: none; } }
@media (max-width: 900px) { .in { top: auto; } }
.out { display: grid; gap: 16px; min-width: 0; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border-radius: 10px;
  background: var(--surface-2); color: var(--fg); font-weight: 600; font-size: 13.5px; line-height: 1.2; white-space: nowrap;
  transition: background .12s ease, transform .06s ease, opacity .12s ease;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--ink); color: var(--ink-fg); }
.btn.primary:hover { opacity: .9; background: var(--ink); }
.btn.accent { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
.btn.block { width: 100%; padding-block: 11px; font-size: 14px; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12.5px; font-weight: 600; color: var(--fg-2); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.field > label em, .field > .lbl em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12px; }
.field input[type="text"], .field select, .field textarea {
  width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid transparent; background: var(--surface-2); color: var(--fg);
  font-size: 13.5px; line-height: 1.5; transition: background .12s ease, border-color .12s ease;
}
.field select { appearance: none; -webkit-appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.field textarea { resize: vertical; min-height: 76px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .8; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .row, .row3 { grid-template-columns: 1fr; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 11px; border-radius: 999px; background: var(--surface-2); font-size: 12.5px; font-weight: 500; color: var(--fg-2); line-height: 1.2; transition: background .12s ease; border: 1px solid transparent; }
.chip:hover { background: var(--surface-3); color: var(--fg); }
.chip.on { background: var(--ink); color: var(--ink-fg); }
.chip.dash { background: transparent; border-color: var(--line-2); }
.chip.dash:hover { border-color: var(--accent); color: var(--accent); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--fg-2); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow-sm); }
.seg.block { display: flex; } .seg.block button { flex: 1; }

.switch { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.switch input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.switch b { color: var(--fg-2); font-weight: 600; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.hint.err { color: var(--bad); }
.divider { height: 1px; background: var(--line); }

/* ---------- cards & content ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-head h3 { font-size: 15px; font-weight: 700; }
.card-head .sub { font-size: 12.5px; color: var(--muted); }
.card-head .right { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card-body { padding: 18px; display: grid; gap: 18px; min-width: 0; }
.tile { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; align-content: start; }
.tile h4 { font-size: 13.5px; font-weight: 700; }
.tile p, .tile li { font-size: 13.5px; color: var(--fg-2); }
.tile ul { padding-left: 18px; display: grid; gap: 4px; }
.tile .meta { font-size: 12px; color: var(--muted); }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
.blk { display: grid; gap: 10px; min-width: 0; }
.blk > h4 { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }

.empty { padding: 48px 20px; text-align: center; color: var(--muted); font-size: 13.5px; display: grid; gap: 6px; justify-items: center; }
.empty b { color: var(--fg-2); font-weight: 600; }

/* state pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1s infinite; }

/* notice */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--fg-2); font-size: 13px; line-height: 1.5; }
.notice b { color: var(--accent); font-weight: 600; }
.notice.warn { background: var(--warn-soft); } .notice.warn b { color: var(--warn); }
.notice .x { margin-left: auto; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 2px; flex: none; }

/* skeleton loading */
.skel { display: grid; gap: 10px; padding: 4px 0; }
.skel i { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
.skel i:nth-child(1) { width: 40%; height: 18px; } .skel i:nth-child(2) { width: 92%; } .skel i:nth-child(3) { width: 85%; } .skel i:nth-child(4) { width: 60%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.gen { display: grid; gap: 12px; }
.gen .st { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-2); font-weight: 500; }
.gen details { font-size: 12px; color: var(--muted); }
.gen summary { cursor: pointer; }
.gen pre { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; max-height: 160px; overflow: hidden; margin: 8px 0 0; color: var(--muted); }

/* ---------- plan: stage tabs ---------- */
.stages { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; overflow-x: auto; }
.stages button { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--fg-2); white-space: nowrap; min-width: 0; }
.stages button .k { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.stages button .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; margin-left: auto; }
.stages button.on { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow-sm); }
.stages button[data-k="done"] .dot { background: var(--ok); }
.stages button[data-k="run"] .dot { background: var(--accent); animation: blink 1s infinite; }
.stages button[data-k="fail"] .dot { background: var(--bad); }
.stages button[data-k="wait"] .dot { background: var(--warn); }
.stages button[data-k="demo"] .dot { background: var(--accent); }
@media (max-width: 640px) { .stages button { padding: 8px 10px; } .stages button .label { display: none; } .stages button .k { font-size: 12px; color: inherit; } }

.lead { padding: 18px 20px; border-radius: 12px; background: var(--accent-soft); display: grid; gap: 4px; }
.lead small { font-size: 11.5px; font-weight: 600; color: var(--accent); letter-spacing: .06em; }
.lead div { font-size: 18px; font-weight: 700; line-height: 1.45; }
.persona { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: start; }
.avatar { width: 52px; height: 52px; border-radius: 14px; background: var(--ink); color: var(--ink-fg); display: grid; place-items: center; font-size: 20px; font-weight: 700; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.kws { display: flex; flex-wrap: wrap; gap: 6px; }
.kw { padding: 5px 11px; border-radius: 999px; background: var(--surface-2); font-size: 12.5px; font-weight: 500; color: var(--fg-2); }
.kw:nth-child(-n+3) { background: var(--ink); color: var(--ink-fg); }

.idea { padding: 24px 26px; border-radius: 14px; background: var(--ink); color: var(--ink-fg); display: grid; gap: 8px; }
.idea .eyebrow { color: var(--ink-fg); opacity: .6; }
.idea .slogan { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: .02em; line-height: 1.2; }
.idea p { font-size: 13.5px; opacity: .85; max-width: 62ch; }
.steps { display: grid; gap: 4px; counter-reset: s; padding: 0; }
.steps li { list-style: none; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; font-size: 13.5px; color: var(--fg-2); padding-block: 4px; }
.steps li::before { counter-increment: s; content: counter(s); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-size: 11px; font-weight: 600; }
.phase-bar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; gap: 2px; }
.phase-bar span:nth-child(1) { background: var(--accent); } .phase-bar span:nth-child(2) { background: var(--ink); } .phase-bar span:nth-child(3) { background: var(--ok); }
.phase .meta b { color: var(--fg); }

.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; white-space: nowrap; background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num { font-family: var(--mono); white-space: nowrap; font-weight: 600; }

.piece { display: grid; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.piece .ph { display: flex; align-items: center; gap: 8px; }
.plat { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--ink); color: var(--ink-fg); letter-spacing: .03em; white-space: nowrap; }
.piece .fmt { font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.piece .ph .btn { margin-left: auto; }
.piece h4 { font-size: 14.5px; }
.piece .body { white-space: pre-wrap; font-size: 13.5px; line-height: 1.7; color: var(--fg-2); background: var(--surface); border-radius: 10px; padding: 12px 14px; }
.piece .tags { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--accent); }
.piece .note { font-size: 12.5px; color: var(--muted); }

.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 10px; align-items: center; }
.bar .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; min-width: 0; }
.bar .lab span:first-child { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .lab span:last-child { color: var(--muted); font-size: 12px; white-space: nowrap; }
.bar .trk { height: 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.bar .trk i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.bar .fmt { font-size: 12px; color: var(--muted); margin-top: 3px; }
.bar .pct { font-family: var(--mono); font-size: 13px; font-weight: 600; text-align: right; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kpi { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi .m { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--accent); line-height: 1.3; word-break: break-word; }
